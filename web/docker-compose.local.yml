# Local override: the whole web app on one port, http://localhost:8080, with no
# host reverse proxy. Used by `make local` together with docker-compose.prod.yml
# and docker-compose.host.yml. The internal Caddy (Caddyfile.a10, the same one
# the production host runs) sends /api to the backend and the rest to the
# frontend, which the browser reaches on the same origin (PUBLIC_API_URL=/api).
services:
  proxy:
    image: caddy:2-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ANON_LOCAL_PORT:-8080}:80"
    volumes:
      - ./Caddyfile.a10:/etc/caddy/Caddyfile:ro
    networks: [anon-net]
    depends_on: [backend, frontend]
