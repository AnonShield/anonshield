# The whole web app on this computer, built from this checkout: the same single
# container as `docker run anonshield/anon:web` (see web/LOCAL.md). From the
# repository root: docker compose -f web/docker-compose.local.yml up -d --build
name: anonshield-local

services:
  anonshield:
    image: anonshield/anon:web
    build:
      context: ..
      dockerfile: web/backend/Dockerfile
      target: local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ANON_LOCAL_PORT:-8080}:8080"
    environment:
      ANON_MAX_SIZE_MB: ${ANON_MAX_SIZE_MB:-0}
      ANON_MAX_SIZE_KEY_MB: ${ANON_MAX_SIZE_KEY_MB:-0}
      ANON_MAX_ZIP_SIZE_MB: ${ANON_MAX_ZIP_SIZE_MB:-0}
    volumes:
      - anonshield:/data
    security_opt: [no-new-privileges:true]

volumes:
  anonshield:
    name: anonshield
