[project]
name = "anonshield"
version = "0.1.0"
description = "Anonimizador"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "protobuf>=6.30.1",
    "python-docx>=1.1.2",
    "sentencepiece>=0.2.2",
    "transformers>=5.10.0,<6.0.0",
    "spacy-huggingface-pipelines>=0.0.4",
    "pytesseract>=0.3.10",
    "Pillow>=10.4.0",
    "PyMuPDF>=1.24.9",
    "lxml>=5.2.2",
    "ijson>=3.5.1",
    "orjson>=3.11.4",
    "tenacity",
    "PyYAML>=6.0.1",
    "python-magic>=0.4.27",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "torch>=2.13.0",
    "torchvision",
    "click>=8.4.2",
]

[tool.uv]
# spacy-huggingface-pipelines (required by presidio's TransformersNlpEngine) is
# unmaintained and still pins transformers<5, which blocks every transformers
# security fix. Its code works unchanged with transformers 5 (covered by the
# test suite), so the pin is overridden.
# presidio-anonymizer pins cryptography<49; it only uses the AES padding/cipher
# primitives (in an operator AnonShield does not call), which are unchanged in
# 50, while the advisories fixed in 49/50 are in X.509 and PKCS#7 handling.
override-dependencies = [
    "transformers>=5.10.0,<6.0.0",
    "cryptography>=50.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-timeout>=2.4.0",
]
# Portuguese spaCy pipeline, loaded for --lang pt. Installed in the Docker images;
# locally: uv sync --group pt
pt = [
    "pt-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_lg-3.8.0/pt_core_news_lg-3.8.0-py3-none-any.whl",
]
# Web server + infrastructure (FastAPI, Celery, Redis…)
# Used by Dockerfile.dev and Dockerfile (prod)
web = [
    { include-group = "pt" },
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "celery[redis]>=5.6.3",
    "redis>=5.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "slowapi>=0.1.9",
]
# Web integration tests (httpx test client)
web-dev = [
    { include-group = "web" },
    "pytest>=9.0.3",
    "pytest-timeout>=2.4.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "ocr: marks tests that require OCR engines to be installed",
]
