# =============================================================================
# AnonShield - Docker Compose Configuration
# =============================================================================
#
# Profiles:
#   cpu       - CPU anonymization (default)
#   gpu       - GPU anonymization
#
# Usage via run.sh (recommended):
#   ./run.sh input.txt                            # cpu profile
#   ./run.sh --gpu input.txt                      # gpu profile
#
# Manual usage:
#   docker compose -f docker/docker-compose.yml --profile cpu \
#       run --rm anon /data/input/file.txt
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # AnonShield - Main Application (CPU)
  # ---------------------------------------------------------------------------
  anon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: anonshield/anon:latest
    container_name: anon-cpu
    environment:
      - ANON_SECRET_KEY=${ANON_SECRET_KEY:?Set ANON_SECRET_KEY or use docker/run.sh to create a private key automatically}
      - ANON_LAZY_LOADING=1
    volumes:
      - anon-models:/app/models
      - anon-output:/app/output
      - anon-db:/app/db
      - ${DATA_DIR:-../data}:/data:ro
    networks:
      - anon-network
    profiles:
      - cpu

  # ---------------------------------------------------------------------------
  # AnonShield - GPU-Accelerated Version
  # ---------------------------------------------------------------------------
  anon-gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gpu
    image: anonshield/anon:gpu
    container_name: anon-gpu
    environment:
      - ANON_SECRET_KEY=${ANON_SECRET_KEY:?Set ANON_SECRET_KEY or use docker/run.sh to create a private key automatically}
      - ANON_LAZY_LOADING=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - anon-models:/app/models
      - anon-output:/app/output
      - anon-db:/app/db
      - ${DATA_DIR:-../data}:/data:ro
    networks:
      - anon-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

# =============================================================================
# Networks
# =============================================================================
networks:
  anon-network:
    driver: bridge
    name: anon-network

# =============================================================================
# Volumes - Persistent Storage
# =============================================================================
volumes:
  anon-models:
    name: anon-models
  anon-output:
    name: anon-output
  anon-db:
    name: anon-db
