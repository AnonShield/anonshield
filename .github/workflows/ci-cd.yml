name: CI/CD

# CI runs on GitHub-hosted runners; the deploy job runs on the self-hosted
# production runner only for pushes to main, after CI passes. The production host
# is never named here: the runner connects out to GitHub and is selected by the
# generic label below.
#
# The "changes" job detects what the push/PR actually touches and emits four
# flags: code (any deployable change, gates the deploy), python (backend, tests,
# packaging or the workflows), frontend (web/frontend) and image (anything that
# goes into the CLI Docker images). Jobs that do not apply
# run a single no-op step and report SUCCESS, so the required status checks stay
# satisfied WITHOUT running the work. A frontend-only change therefore skips the
# Python test suite and the Python SAST, and a docs-only change skips everything
# and the deploy. If the base commit cannot be resolved, everything runs.
#
# Everything that can break runs on the pull request, before the merge: the
# Python suite (unit, regression and end-to-end CLI runs over every format and
# strategy), the web backend tests (with Redis), the frontend build, the scans,
# and the CLI Docker images (built and smoke-tested, not pushed). On main, the
# images are pushed and the app deployed only after all of those pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        # code: touches the app, deps, tests or the workflows (gates the deploy).
        # python: touches Python code, tests, packaging or the workflows.
        # frontend: touches web/frontend. A docs-only change yields all false.
        # If the base commit cannot be resolved (first push, force-push), default
        # to all true so nothing is skipped unsafely.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            printf 'code=true\npython=true\nfrontend=true\nimage=true\n' >> "$GITHUB_OUTPUT"
            echo "Base commit unavailable; treating as a full change."
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"; printf '  %s\n' $changed
          code=false; python=false; frontend=false; image=false
          if printf '%s\n' "$changed" | grep -qE '^(src/|web/|tests/|scripts/|anon\.py|pyproject\.toml|uv\.lock|\.github/workflows/)'; then
            code=true
          fi
          if printf '%s\n' "$changed" | grep -qE '^(src/|tests/|scripts/|web/backend/|anon\.py|pyproject\.toml|uv\.lock|\.github/workflows/)'; then
            python=true
          fi
          if printf '%s\n' "$changed" | grep -qE '^web/frontend/'; then
            frontend=true
          fi
          if printf '%s\n' "$changed" | grep -qE '^(docker/Dockerfile|docker/docker-entrypoint\.sh|src/|scripts/|tests/|examples/|anon\.py|pyproject\.toml|uv\.lock|\.github/workflows/(docker-image|ci-cd)\.yml)'; then
            image=true
          fi
          printf 'code=%s\npython=%s\nfrontend=%s\nimage=%s\n' "$code" "$python" "$frontend" "$image" >> "$GITHUB_OUTPUT"
          echo "Resolved: code=$code python=$python frontend=$frontend image=$image"

  test:
    name: Python tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANON_SECRET_KEY: test-key-12345678901234567890123456789012
    steps:
      - if: needs.changes.outputs.python != 'true'
        run: echo "No Python code touched, nothing to test."
      - if: needs.changes.outputs.python == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: needs.changes.outputs.python == 'true'
        name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - if: needs.changes.outputs.python == 'true'
        name: Install dependencies
        run: uv sync --group dev
      - if: needs.changes.outputs.python == 'true'
        name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1
      - if: needs.changes.outputs.python == 'true'
        name: Run tests
        run: uv run pytest -m "not slow and not ocr" -q --timeout=300

  frontend:
    name: Frontend build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # SvelteKit needs this public var present at build time; the value only
      # matters at runtime (the deployed image injects the real one).
      PUBLIC_API_URL: http://localhost:8000
    steps:
      - if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend code touched, nothing to build."
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          # Same major as the production image (node:22-alpine in web/frontend/Dockerfile).
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - if: needs.changes.outputs.frontend == 'true'
        run: npm ci
        working-directory: web/frontend
      - if: needs.changes.outputs.frontend == 'true'
        run: npm run build
        working-directory: web/frontend

  vuln-scan:
    name: Dependency & container scan
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change, nothing to scan."
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: needs.changes.outputs.python == 'true'
        name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - if: needs.changes.outputs.python == 'true'
        name: Python dependency audit (pip-audit)
        run: |
          uv export --frozen --no-dev --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --progress-spinner off
        continue-on-error: true
      - if: needs.changes.outputs.frontend == 'true'
        name: Frontend dependency audit (npm audit)
        working-directory: web/frontend
        run: npm audit --audit-level=high
        continue-on-error: true
      - if: needs.changes.outputs.code == 'true'
        name: Filesystem vulnerability & misconfig scan (Trivy)
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/trivy" fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress .
        continue-on-error: true

  secret-scan:
    name: Secret scan & SAST
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change, no code to scan."
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: needs.changes.outputs.code == 'true'
        name: Secret scan (gitleaks)
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --config .gitleaks.toml --no-banner --redact --exit-code 1
      - if: needs.changes.outputs.python == 'true'
        name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - if: needs.changes.outputs.python == 'true'
        name: Python SAST (bandit)
        # Blocking: a medium or higher finding fails this job (and gates the deploy),
        # so it surfaces as a red run instead of a silently-green check.
        run: uvx bandit -r src web/backend -ll -q

  web-tests:
    name: Web backend tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      ANON_SECRET_KEY: test-key-12345678901234567890123456789012
    steps:
      - if: needs.changes.outputs.python != 'true'
        run: echo "No Python code touched, nothing to test."
      - if: needs.changes.outputs.python == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: needs.changes.outputs.python == 'true'
        name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - if: needs.changes.outputs.python == 'true'
        name: Install dependencies
        run: uv sync --group web-dev
      - if: needs.changes.outputs.python == 'true'
        name: Run web backend tests
        run: uv run pytest web/backend/tests -q --timeout=300

  # CLI Docker images (docker-image.yml). On a pull request they are built and
  # smoke-tested without pushing; on main they are pushed after the tests pass.
  docker:
    name: Docker image
    needs: changes
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-image.yml
    with:
      run: ${{ needs.changes.outputs.image == 'true' }}
      push: false

  docker-publish:
    name: Docker image
    needs: [changes, test, web-tests, frontend, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'AnonShield/anonshield'
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    uses: ./.github/workflows/docker-image.yml
    with:
      run: ${{ needs.changes.outputs.image == 'true' }}
      push: true
    secrets: inherit

  # Web app images (backend/worker and frontend). Built on every pull request
  # as a check; on main, pushed to GHCR (tagged with the commit and "latest")
  # once the tests pass, for the deploy job to pull.
  web-images:
    name: Web images
    needs: [changes, test, web-tests, frontend, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'AnonShield/anonshield' }}
      REGISTRY: ghcr.io/anonshield
    steps:
      - if: needs.changes.outputs.code != 'true'
        run: echo "No deployable change, no web images to build."
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: needs.changes.outputs.code == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: needs.changes.outputs.code == 'true' && env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        if: needs.changes.outputs.code == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/backend/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/anonshield-web-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/anonshield-web-backend:latest
          cache-from: type=gha,scope=web-backend
          cache-to: ${{ env.PUSH == 'true' && 'type=gha,mode=max,scope=web-backend' || '' }}
      - name: Build frontend image
        if: needs.changes.outputs.code == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web/frontend
          file: web/frontend/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/anonshield-web-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/anonshield-web-frontend:latest
          cache-from: type=gha,scope=web-frontend
          cache-to: ${{ env.PUSH == 'true' && 'type=gha,mode=max,scope=web-frontend' || '' }}

  # Runs on the self-hosted runner of the host that serves anonshield.org
  # (label anonshield-prod). It only pulls the images built above and restarts
  # the stack from web/docker-compose.a10.yml; nothing is built on the host.
  deploy:
    name: Deploy to production
    needs: [changes, web-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'AnonShield/anonshield' && needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, anonshield-prod]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the stack files
        # Only the files the stack reads; the host's .env is never touched.
        run: |
          set -euo pipefail
          DEST="$HOME/anonshield_deploy/web"
          mkdir -p "$DEST"
          cp web/docker-compose.a10.yml web/Caddyfile.a10 web/warm_cache.sh "$DEST/"
          test -f "$DEST/.env" || { echo "::error::$DEST/.env is missing (ANON_SECRET_KEY)"; exit 1; }
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and restart the stack
        run: |
          set -euo pipefail
          cd "$HOME/anonshield_deploy/web"
          docker compose -f docker-compose.a10.yml pull
          docker compose -f docker-compose.a10.yml up -d --remove-orphans
          docker compose -f docker-compose.a10.yml ps
      - name: Warm the model cache (runs a real anonymization job)
        run: bash "$HOME/anonshield_deploy/web/warm_cache.sh" http://127.0.0.1:18000
      - name: Check that the public site runs this commit
        # The old check only asked whether the site was up; a stack that was
        # never updated passed it. The backend reports the deployed commit.
        run: |
          for i in $(seq 1 12); do
            got="$(curl -fsS https://anonshield.org/api/health || true)"
            echo "$got"
            case "$got" in *"\"version\":\"$IMAGE_TAG\""*) exit 0 ;; esac
            sleep 10
          done
          echo "::error::anonshield.org does not report $IMAGE_TAG"
          exit 1
      - name: Remove this app's previous images
        # Only AnonShield's own images: the host is shared, so no global prune.
        if: always()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '^ghcr\.io/anonshield/anonshield-web-(backend|frontend):' \
            | grep -vE ":($IMAGE_TAG|latest)$" | xargs -r docker image rm || true
