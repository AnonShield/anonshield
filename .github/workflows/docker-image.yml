name: Docker image

# Builds the standalone CLI images (anonshield/anon): the CPU image (:latest) and
# two GPU builds, chosen per host by docker/run.sh --gpu: :gpu (CUDA 13.0, driver
# 580+, RTX 20xx or newer, needed for RTX 50xx) and :gpu-cu126 (older GPUs and
# drivers). The Dockerfile itself fails the GPU build if torch has no CUDA.
# The "web" job builds :web, the whole web app in one container for one computer
# (web/backend/Dockerfile, target local), and "web-gpu" the same app on the GPU
# builds of torch: :web-gpu (CUDA 13.0) and :web-gpu-cu126, chosen per host by
# docker/run.sh --web --gpu.
#
#  - Called from ci-cd.yml (workflow_call):
#      pull request: build all three and smoke-test the CPU image, without
#        pushing, so a broken image fails the PR before it reaches main;
#      push to main: the same after the test jobs pass, then push.
#    With run false (nothing that goes into the image changed) the job reports
#    success without building, so it can be a required status check.
#  - Published release or manual run: build and push, plus version-suffixed tags
#    (:X.Y.Z, :X.Y.Z-gpu, :X.Y.Z-gpu-cu126, :X.Y.Z-web, :X.Y.Z-web-gpu and
#    :X.Y.Z-web-gpu-cu126). A manual run with images=web builds and pushes only
#    the web images.
#
# README-only changes are handled by dockerhub-readme.yml (description sync, no build).
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (push access to anonshield/anon),
# used only when pushing.

on:
  workflow_call:
    inputs:
      run:
        description: "false to skip the build (no image input changed)"
        type: boolean
        default: true
      push:
        description: "true to push the images"
        type: boolean
        default: false
      run_web:
        description: "false to skip the web image (nothing that goes into it changed)"
        type: boolean
        default: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.0.0)"
        required: false
        default: latest
      images:
        description: "Which images to build and push"
        type: choice
        options: [all, web]
        default: all

permissions:
  contents: read

env:
  IMAGE: anonshield/anon

jobs:
  build:
    name: CLI images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Under workflow_call, github.event_name is the caller's event (push or
      # pull_request); a release or a manual run always builds and publishes.
      # PUSH needs RUN: on main with no image change, the push step used to run
      # with nothing built and fail the job.
      RUN: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.images != 'web') || inputs.run }}
      PUSH: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.images != 'web') || (inputs.run && inputs.push)) && github.repository == 'AnonShield/anonshield' }}
    steps:
      - if: env.RUN != 'true'
        run: echo "Nothing that goes into the image changed; no build."
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free up runner disk space (the GPU images are large)
        if: env.RUN == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - if: env.RUN == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve image tags
        id: tags
        if: env.RUN == 'true'
        # CPU image is always :latest; GPU images are :gpu and :gpu-cu126. A
        # version-suffixed tag is added only for a real release, never for the
        # plain "latest" publish (which would otherwise create a stray :latest-gpu).
        run: |
          VER="${{ github.event.release.tag_name || inputs.tag || 'latest' }}"
          {
            echo "cpu<<EOF"
            echo "$IMAGE:latest"
            if [ "$VER" != "latest" ] && [ -n "$VER" ]; then echo "$IMAGE:$VER"; fi
            echo "EOF"
            echo "gpu<<EOF"
            echo "$IMAGE:gpu"
            if [ "$VER" != "latest" ] && [ -n "$VER" ]; then echo "$IMAGE:$VER-gpu"; fi
            echo "EOF"
            echo "gpu_cu126<<EOF"
            echo "$IMAGE:gpu-cu126"
            if [ "$VER" != "latest" ] && [ -n "$VER" ]; then echo "$IMAGE:$VER-gpu-cu126"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # The CPU image is built and loaded first, smoke-tested, then pushed from
      # the same cache. Only publishing runs write the build cache.
      - name: Build CPU image
        if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: production
          load: true
          tags: anon-cpu:ci
          cache-from: type=gha,scope=cpu
          cache-to: ${{ env.PUSH == 'true' && 'type=gha,mode=max,scope=cpu' || '' }}
      - name: Smoke test CPU image
        if: env.RUN == 'true'
        # regex (no model), then the default NER strategy twice on the same
        # models volume: the second run has no network, which fails if the model
        # is not cached where the container loads it from.
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/smoke"; mkdir -p "$T/in" "$T/out" "$T/models"
          printf 'Contact Maria Oliveira <maria@example.com> from 192.168.10.45.\nJohn Smith lives in New York.\n' > "$T/in/s.txt"
          run() { docker run --rm -e ANON_SECRET_KEY=ci-smoke-key -v "$T/in:/data:ro" -v "$T/out:/app/output" \
                    -v "$T/models:/app/models" "$@" /data/s.txt --db-mode in-memory --overwrite; }
          check() { cat "$T/out/anon_s.txt"; ! grep -E "$1" "$T/out/anon_s.txt"; }
          run anon-cpu:ci --anonymization-strategy regex
          check 'maria@example.com|192\.168\.10\.45'
          run anon-cpu:ci
          check 'maria@example.com|192\.168\.10\.45|Maria Oliveira|John Smith|York'
          run --network none anon-cpu:ci
          check 'maria@example.com|192\.168\.10\.45|Maria Oliveira|John Smith|York'
          docker run --rm --entrypoint python anon-cpu:ci -c "import spacy; assert spacy.util.is_package('pt_core_news_lg')"
      - name: Smoke test the wrappers as a user runs them
        if: env.RUN == 'true'
        # docker/run.sh from this commit, with no key and no setup, as the
        # runner user (not root), in a folder an older version left root-owned
        # (the model cache of the step above): the key must be created, the
        # folder handed back, the output owned by the user, and a second run
        # must give the same pseudonyms. Then run.ps1 under PowerShell.
        run: |
          set -euo pipefail
          docker tag anon-cpu:ci anonshield/anon:latest
          W="$RUNNER_TEMP/wrapper"; mkdir -p "$W/anon"; cd "$W"
          sudo cp -a "$RUNNER_TEMP/smoke/models" anon/models
          printf 'Contact Maria Oliveira <maria@example.com> from 192.168.10.45, +1 212 555 0198.\n' > "nota final.txt"
          unset ANON_SECRET_KEY
          out="anon/output/anon_nota final.txt"
          "$GITHUB_WORKSPACE/docker/run.sh" "nota final.txt" --db-mode in-memory
          cat "$out"; if grep -E 'maria@example.com|192\.168\.10\.45|212 555|Maria Oliveira' "$out"; then exit 1; fi
          test -s anon/secret.key
          test -z "$(find anon ! -user "$(id -u)" -print -quit)"
          first=$(cat "$out")
          "$GITHUB_WORKSPACE/docker/run.sh" "nota final.txt" --db-mode in-memory --overwrite
          test "$first" = "$(cat "$out")"
          mkdir "$W/ps" && cd "$W/ps" && cp "$W/nota final.txt" .
          pwsh -NoProfile -File "$GITHUB_WORKSPACE/docker/run.ps1" "nota final.txt" --anonymization-strategy regex --db-mode in-memory
          cat "$out"; if grep -E 'maria@example.com|192\.168\.10\.45|212 555' "$out"; then exit 1; fi
          test -s anon/secret.key
          docker image rm anonshield/anon:latest
      - name: Push CPU image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.tags.outputs.cpu }}
          cache-from: type=gha,scope=cpu
      - name: Free runner disk before the GPU builds
        if: env.RUN == 'true'
        run: |
          docker image rm anon-cpu:ci || true
          docker buildx prune -af || true
      # The GPU builds reuse the CPU build cache (same base and venv layers) and
      # export none: exporting the CUDA layers to the GitHub cache took ~16 min
      # per image, ran the job past its timeout, and does not fit the 10 GB cache.
      - name: Build GPU image (CUDA 13.0)
        if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: gpu
          build-args: TORCH_CUDA=cu130
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.gpu }}
          cache-from: type=gha,scope=cpu
      - name: Free runner disk between GPU builds
        if: env.RUN == 'true'
        run: docker buildx prune -af || true
      - name: Build GPU image (CUDA 12.6)
        if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: gpu
          build-args: TORCH_CUDA=cu126
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.gpu_cu126 }}
          cache-from: type=gha,scope=cpu

  web:
    name: Web image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || inputs.run_web }}
      PUSH: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (inputs.run_web && inputs.push)) && github.repository == 'AnonShield/anonshield' }}
    steps:
      - if: env.RUN != 'true'
        run: echo "Nothing that goes into the web image changed; no build."
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: env.RUN == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve image tags
        id: tags
        if: env.RUN == 'true'
        run: |
          VER="${{ github.event.release.tag_name || inputs.tag || 'latest' }}"
          {
            echo "web<<EOF"
            echo "$IMAGE:web"
            if [ "$VER" != "latest" ] && [ -n "$VER" ]; then echo "$IMAGE:$VER-web"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build web image
        if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/backend/Dockerfile
          target: local
          load: true
          tags: anon-web:ci
          cache-from: type=gha,scope=web-local
          cache-to: ${{ env.PUSH == 'true' && 'type=gha,mode=max,scope=web-local' || '' }}
      - name: Smoke test web image
        if: env.RUN == 'true'
        # Started the way the README says, then a regex job and a NER job through
        # the API the interface uses, and the interface itself. Leak checks use
        # "if grep; then exit 1": under set -e a bare "! grep" never fails the step.
        run: |
          set -euo pipefail
          docker run -d --name web -p 127.0.0.1:8080:8080 -v anonshield-ci:/data anon-web:ci
          for i in $(seq 90); do [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy ] && break; sleep 2; done
          docker logs web
          test "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy
          curl -fsS http://localhost:8080/app | grep -q '<html'
          printf 'Contact Maria Oliveira <maria@example.com> from 192.168.10.45.\n' > s.txt
          for strategy in regex filtered; do
            id=$(curl -fsS -F file=@s.txt -F "strategy=$strategy" http://localhost:8080/api/jobs | jq -r .job_id)
            for i in $(seq 300); do
              state=$(curl -fsS "http://localhost:8080/api/jobs/$id/status" | jq -r .status)
              if [ "$state" = "done" ] || [ "$state" = "error" ]; then break; fi
              sleep 2
            done
            test "$state" = "done"
            out=$(curl -fsS "http://localhost:8080/api/jobs/$id/download"); echo "$out"
            if grep -E 'maria@example.com|192\.168\.10\.45' <<<"$out"; then exit 1; fi
          done
          if grep 'Maria Oliveira' <<<"$out"; then exit 1; fi
      - if: env.RUN == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json
      - name: End-to-end test in Chrome
        if: env.RUN == 'true'
        # The interface driven as a person uses it, against the container above:
        # field rules, profiles, entities, patterns, batch, ZIP, errors, queue,
        # Cancel, metrics and phone width (web/e2e/e2e.mjs).
        working-directory: web/e2e
        env:
          URL: http://localhost:8080
          E2E_DIR: ${{ runner.temp }}/e2e
        run: |
          npm ci
          npm test
      - name: Screenshots of failed end-to-end steps
        if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failures
          path: ${{ runner.temp }}/e2e/out
      - name: Stop the web container
        if: always() && env.RUN == 'true'
        run: docker rm -f web || true
      - name: Push web image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/backend/Dockerfile
          target: local
          push: true
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha,scope=web-local

  web-gpu:
    name: Web image (GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || inputs.run_web }}
      PUSH: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (inputs.run_web && inputs.push)) && github.repository == 'AnonShield/anonshield' }}
    steps:
      - if: env.RUN != 'true'
        run: echo "Nothing that goes into the web image changed; no build."
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free up runner disk space (the GPU images are large)
        if: env.RUN == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - if: env.RUN == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve image tags
        id: tags
        if: env.RUN == 'true'
        run: |
          VER="${{ github.event.release.tag_name || inputs.tag || 'latest' }}"
          {
            echo "gpu<<EOF"
            echo "$IMAGE:web-gpu"
            if [ "$VER" != "latest" ] && [ -n "$VER" ]; then echo "$IMAGE:$VER-web-gpu"; fi
            echo "EOF"
            echo "gpu_cu126<<EOF"
            echo "$IMAGE:web-gpu-cu126"
            if [ "$VER" != "latest" ] && [ -n "$VER" ]; then echo "$IMAGE:$VER-web-gpu-cu126"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Same stages as :web up to the venv, which gets the CUDA build of torch
      # (the build fails if it is still CPU-only). Reads the :web cache, writes
      # none (the CUDA layers do not fit the 10 GB cache; see the CLI job).
      - name: Build GPU web image (CUDA 13.0)
        if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/backend/Dockerfile
          target: local
          build-args: |
            LOCAL_BASE=runtime-gpu
            TORCH_CUDA=cu130
          load: true
          tags: anon-web-gpu:ci
          cache-from: type=gha,scope=web-local
      - name: Smoke test GPU web image
        if: env.RUN == 'true'
        # The runner has no GPU: the image must still start, say that it runs
        # on the CPU and how to give it the GPU, and finish a regex and a NER job.
        run: |
          set -euo pipefail
          docker run -d --name web-gpu -p 127.0.0.1:8080:8080 -v anonshield-ci:/data anon-web-gpu:ci
          for i in $(seq 90); do [ "$(docker inspect -f '{{.State.Health.Status}}' web-gpu)" = healthy ] && break; sleep 2; done
          test "$(docker inspect -f '{{.State.Health.Status}}' web-gpu)" = healthy
          printf 'Contact Maria Oliveira <maria@example.com> from 192.168.10.45.\n' > s.txt
          for strategy in regex filtered; do
            id=$(curl -fsS -F file=@s.txt -F "strategy=$strategy" http://localhost:8080/api/jobs | jq -r .job_id)
            for i in $(seq 300); do
              state=$(curl -fsS "http://localhost:8080/api/jobs/$id/status" | jq -r .status)
              if [ "$state" = "done" ] || [ "$state" = "error" ]; then break; fi
              sleep 2
            done
            test "$state" = "done"
            out=$(curl -fsS "http://localhost:8080/api/jobs/$id/download"); echo "$out"
            if grep -E 'maria@example.com|192\.168\.10\.45' <<<"$out"; then exit 1; fi
          done
          if grep 'Maria Oliveira' <<<"$out"; then exit 1; fi
          docker logs web-gpu 2>&1 | tee logs.txt
          grep -q 'no NVIDIA GPU is visible.*--gpus all' logs.txt
          docker exec web-gpu python -c "import torch; assert torch.version.cuda.startswith('13'), torch.version.cuda"
      - name: Stop the web container
        if: always() && env.RUN == 'true'
        run: docker rm -f web-gpu || true
      - name: Push GPU web image (CUDA 13.0)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/backend/Dockerfile
          target: local
          build-args: |
            LOCAL_BASE=runtime-gpu
            TORCH_CUDA=cu130
          push: true
          tags: ${{ steps.tags.outputs.gpu }}
          cache-from: type=gha,scope=web-local
      - name: Free runner disk before the CUDA 12.6 build
        if: env.RUN == 'true'
        run: |
          docker image rm anon-web-gpu:ci || true
          docker buildx prune -af || true
      - name: Build GPU web image (CUDA 12.6)
        if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/backend/Dockerfile
          target: local
          build-args: |
            LOCAL_BASE=runtime-gpu
            TORCH_CUDA=cu126
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.gpu_cu126 }}
          cache-from: type=gha,scope=web-local
